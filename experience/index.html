<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mariam — Our Little Forever</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#572c57,#180e27 70%);color:#fff1f9;font-family:Georgia,serif;text-align:center;min-height:100dvh}.stars{position:fixed;inset:0;pointer-events:none;opacity:.4;background-image:radial-gradient(white 1px,transparent 1px);background-size:65px 80px}main{position:relative;max-width:560px;margin:auto;min-height:100dvh;padding:45px 24px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font:12px Arial,sans-serif;letter-spacing:3px;color:#ffc3e2;text-transform:uppercase}h1{font-size:clamp(36px,11vw,62px);font-weight:normal;margin:22px 0}p{font-size:19px;line-height:1.75}button{border:0;border-radius:30px;background:linear-gradient(110deg,#ffe2f0,#ed9bc8);padding:16px 24px;font:600 14px Arial,sans-serif;color:#31162b;margin:20px auto;cursor:pointer}.card{padding:20px;background:#ffffff14;border:1px solid #ffffff33;border-radius:20px}.chat{text-align:left;font:15px/1.7 Arial,sans-serif}.chat p{font:15px/1.7 Arial,sans-serif;background:#ffffff12;padding:12px;border-radius:12px}.heart{font-size:65px;animation:pulse 2.3s infinite}@keyframes pulse{50%{transform:scale(1.15)}}.fog{background:linear-gradient(135deg,#d9dce9,#9a9bb6);border-radius:20px;padding:65px 20px;color:#3a2a4b;touch-action:none;cursor:pointer}.fog.revealed{background:#392438;color:#fff0f9}.note{font:12px/1.5 Arial,sans-serif;color:#d5afc5}.petals{font-size:40px}</style></head><body><div class="stars"></div><main id="app"></main><script>
let step=0;const pages=[
['Mariam','Il y a des rencontres qui changent tout. La nôtre a commencé par un commentaire.','Ouvre ton univers'],
['Un soir sur TikTok','<div class="card chat"><div class="eyebrow">● LIVE · Lilryaax</div><p>Un spectateur : Vous iriez bien ensemble !</p><p><b>Mariam :</b> Voilà dites-lui de m’ajouter et de me DM svp merci 😂</p></div><p>Parmi tous les messages, il y avait le tien.</p>','Après le live…'],
['Un message. Puis nous.','Après le live, je t’ai ajoutée. On a parlé, et quelques jours plus tard, on s’est vus.<div class="petals">✉️ ✨ 💌</div>J’étais timide. Toi, tu étais belle. Et dehors, il faisait froid.','Cette soirée'],
['La voiture, ce soir-là','<p>La vitre était embuée. Et ce soir-là, tu as changé ma vie.</p><div id="fog" class="fog" onclick="reveal()">♡<br>Appuie pour effacer la buée</div><p id="kiss" style="display:none">Je t’ai embrassée sur la joue. Puis tu as pris l’initiative de m’embrasser. Et moi… j’étais aux anges.</p>','Notre premier Noël'],
['Notre premier Noël','Une boîte préparée pour toi, du maquillage, un doudou… et surtout des lettres avec les mots que je n’osais pas toujours dire.','Les petits détails'],
['Les petites choses','Une initiale sur tes ongles. Un cœur dans une assiette. Ton prénom dans la neige. L’amour est aussi dans ces petits détails.','Une lettre pour toi'],
['À toi, Mariam','<div class="card">J’aime ton humour, ta douceur, ton petit côté crazy, et cette façon que tu as de travailler si dur pour tes études de médecine.<p>Je suis fier de toi. Je veux apprendre à toujours mieux t’aimer, mieux t’écouter et mieux prendre soin de nous.</p></div>','Le dernier secret'],
['Je te choisirais encore','<div class="heart">💖</div>Tout a commencé par un commentaire.<p>Joyeux premier anniversaire à nous, Mariam. Je t’aime. ❤️</p>','Revivre notre histoire']
];function show(){let p=pages[step];document.getElementById('app').innerHTML='<div class="eyebrow">OUR LITTLE FOREVER · '+(step||'♡')+'/7</div><h1>'+p[0]+'</h1><p>'+p[1]+'</p><button onclick="next()">'+p[2]+' →</button><div class="note">Un cadeau de Rishanth, fait avec amour</div>'}function next(){step=(step+1)%pages.length;show();scrollTo(0,0)}function reveal(){let f=document.getElementById('fog');f.classList.add('revealed');f.innerHTML='✨ Notre premier baiser ✨';document.getElementById('kiss').style.display='block'}show();
</script></body></html>
