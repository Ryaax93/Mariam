<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mariam V2 — contrôle du vrai modèle 3D</title><style>
html,body{margin:0;background:#e3d5cd;color:#533a48;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block}.label{position:absolute;top:12px;left:20px;font-size:12px;max-width:70%;pointer-events:none}.label strong{display:block;font-size:15px;margin-bottom:4px}nav{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}button{border:1px solid #c3a8b5;background:#fff5eddd;color:#633e51;border-radius:20px;padding:7px 13px;cursor:pointer;font:11px system-ui}footer{position:absolute;bottom:10px;left:20px;font-size:11px;opacity:.8;max-width:80%;pointer-events:none}
</style></head><body><div class="label"><strong>Mariam · étude 3D V2</strong>Ressemblance aux planches officielles encore à valider</div><nav aria-label="Vues du personnage"><button data-view="face">Face</button><button data-view="profil">Profil</button><button data-view="dos">Dos</button><button data-view="portrait">Visage</button><button data-view="pose">Figures</button></nav><footer>Maillage et squelette en temps réel · peau, vêtements et accessoires en volume</footer><script type="module">
import * as T from '../../vendor/three.module.js';import {MariamRig} from '../character.js';
const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1;document.body.append(r.domElement);
const s=new T.Scene();s.background=new T.Color(0xe3d5cd);s.add(new T.HemisphereLight(0xfff8ed,0x8b7a8a,2));const l=new T.DirectionalLight(0xffe7cf,2.2);l.position.set(-3,5,4);s.add(l);const fill=new T.DirectionalLight(0xc5d5ff,.7);fill.position.set(3,2,-3);s.add(fill);const a=new MariamRig();s.add(a.root);
const c=new T.PerspectiveCamera(32,innerWidth/innerHeight,.1,30);
function frame(){c.position.set(0,1.35,4.6);c.lookAt(0,1.14,0);}
frame();window.setReviewAngle=v=>{for(const b of a.bones)b.rotation.set(0,0,0);a.bones[0].position.y=1.12;a.root.rotation.set(0,v,0);frame();r.render(s,c);};
window.setReviewPortrait=()=>{a.root.rotation.set(0,0,0);c.position.set(0,2.03,1.16);c.lookAt(0,2.025,0);r.render(s,c);};
window.setReviewPose=(name,phase=.5)=>{frame();a.heading=0;for(let i=0;i<30;i++)a.animate(1/60,{v:5,vl:0,grounded:false,trickName:name,trickPhase:phase,landing:0,status:'playing'},0);r.render(s,c);};
let figure=-1;const names=['rotation','etoile','arabesque','croise','rythme'];document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const v=b.dataset.view;if(v==='portrait')window.setReviewPortrait();else if(v==='pose'){figure=(figure+1)%names.length;window.setReviewPose(names[figure]);}else window.setReviewAngle(v==='profil'?Math.PI/2:v==='dos'?Math.PI:0);});
window.addEventListener('resize',()=>{r.setSize(innerWidth,innerHeight);c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.render(s,c);});
window.setReviewAngle(0);window.rigReviewReady=true;window.rigReviewStats=()=>a.stats;
</script></body></html>
