<!doctype html><html><head><meta charset="utf-8"><title>Contrôle comparatif 3D</title><style>body{margin:0}canvas{display:block}p{position:absolute;left:20px;top:0;background:#fff0d9da;padding:8px 12px;font:12px sans-serif;color:#624155}</style></head><body><p id="caption"></p><script type="module">
import * as T from '../../vendor/three.module.js';import {SkateSession} from '../simulation.js';
const q=new URLSearchParams(location.search),before=q.get('version')==='v1',base=before?'../../.luna-v1/':'../';
const [{LunaWorld},{MariamRig},{SightCorridor},{FollowCamera},{center,slope}]=await Promise.all([import(base+'world.js'),import(base+'character.js'),import(base+'camera.js'),import('../../.luna-v1/camera.js'),import('../track.js')]);
const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.05;r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;document.body.append(r.domElement);
const scene=new T.Scene(),world=new LunaWorld(scene),rig=new MariamRig(),c=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,450),cam=new FollowCamera(c),sight=new SightCorridor(),s=new SkateSession();s.s=Number(q.get('s')||40);s.v=7;s.status='playing';rig.root.position.set(center(s.s),.015,-s.s);rig.animate(.016,s,Math.atan2(slope(s.s),-1));scene.add(rig.root);
if(before){const clones=new Map();for(const g of [world.decor,world.detail]){g.traverse(o=>{if(!o.isMesh)return;if(!clones.has(o.material))clones.set(o.material,o.material.clone());o.material=clones.get(o.material);});sight.attach(g);}}else for(const o of world.occluders)sight.attach(o);
cam.update(.016,s);world.update(0,s,false);scene.updateMatrixWorld(true);const body=new T.Vector3(center(s.s),1.2,-s.s);for(let i=0;i<30;i++)sight.update(r,c,body,cam.landing,.016);r.render(scene,c);
const ray=new T.Raycaster(new T.Vector3(center(s.s),7,-s.s),new T.Vector3(0,-1,0),0,7);const intersections=ray.intersectObjects([world.decor,world.detail],true).filter(h=>h.point.y>.05);
window.comparison={version:before?'V1':'V2',s:s.s,position:c.position.toArray(),landscapeAboveTrack:intersections.map(h=>({y:h.point.y,name:h.object.name||h.object.type})),playMaterialsOpaque:true,calls:r.info.render.calls,triangles:r.info.render.triangles};world.play.traverse(o=>{if(o.isMesh&&o.material.opacity!==1)window.comparison.playMaterialsOpaque=false;});document.getElementById('caption').textContent=(before?'AVANT · version livrée':'APRÈS · V2')+' / '+s.s+' m · caméra identique · scène technique 3D';window.comparisonReady=true;
</script></body></html>
